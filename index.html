<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Sayangku</title>
    <style>
        :root {
            --primary-color: #ff4d6d;
            --bg-dark: #0f0c29;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, #24243e, #302b63, #0f0c29);
            color: white;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Animasi Partikel Hati */
        .hearts {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            animation: fadeIn 1.5s ease-in-out;
        }

        .image-box {
            position: relative;
            width: 100%;
            height: 500px;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid var(--primary-color);
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Disembunyikan dulu untuk JS */
            animation: zoomIn 1s ease-out;
        }

        .image-box img.active {
            display: block;
        }

        .text-overlay {
            margin-top: 20px;
            min-height: 80px;
        }

        .typing-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #ff85a1;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
        }

        .btn-next {
            margin-top: 20px;
            padding: 10px 25px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }

        .btn-next:hover {
            transform: scale(1.1);
            background: #ff758f;
        }

        /* Keyframes */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { transform: scale(1.2); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="hearts" id="heartContainer"></div>

    <div class="container">
        <div class="card">
            <div class="image-box" id="gallery">
                <img src="IMG-20260317-WA0057.jpg" class="active">
                <img src="IMG-20260317-WA0061.jpg">
                <img src="IMG-20260317-WA0055.jpg">
                <img src="IMG-20260317-WA0059.jpg">
                <img src="IMG-20260317-WA0058.jpg">
                <img src="IMG-20260317-WA0060.jpg">
                <img src="suci1.jpg">
                <img src="suci 2.jpg">
                <img src="IMG-20260317-WA0056.jpg">
                <img src="IMG-20260317-WA0062.jpg">
            </div>

            <div class="text-overlay">
                <p class="typing-text" id="caption"></p>
            </div>

            <button class="btn-next" onclick="nextSlide()">Klik Untuk Kamu ❤️</button>
        </div>
    </div>

    <script>
        const messages = [
            "Hai cantik, semangat ya hari ini! ✨",
            "Kamu tau nggak? Kamu itu alasan aku tersenyum.",
            "Jangan lupa makan ya, aku nggak mau kamu sakit.",
            "Setiap foto kamu selalu jadi favorit aku. ❤️",
            "Terima kasih sudah ada buat aku sampai sekarang.",
            "Apapun yang terjadi, aku bakal tetap di sini.",
            "Kamu itu istimewa, jangan pernah dengerin kata orang lain.",
            "Sehat selalu ya sayang, rindu terus sama kamu.",
            "I love you more than words can say... 🌹",
            "Ini cuma buat kamu, khusus buat yang paling spesial."
        ];

        let currentIndex = 0;
        const images = document.querySelectorAll('#gallery img');
        const captionElement = document.getElementById('caption');

        function typeWriter(text, i, fnCallback) {
            if (i < text.length) {
                captionElement.innerHTML = text.substring(0, i+1) + '<span aria-hidden="true">|</span>';
                setTimeout(function() {
                    typeWriter(text, i + 1, fnCallback)
                }, 100);
            } else if (typeof fnCallback == 'function') {
                setTimeout(fnCallback, 700);
            }
        }

        function startTyping(i) {
            typeWriter(messages[i], 0);
        }

        function nextSlide() {
            images[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % images.length;
            images[currentIndex].classList.add('active');
            startTyping(currentIndex);
        }

        // Efek Hati Berjatuhan
        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.style.position = 'absolute';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            heart.style.opacity = Math.random();
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            heart.style.top = '-10%';
            heart.style.transition = 'linear';
            
            document.getElementById('heartContainer').appendChild(heart);

            const anim = heart.animate([
                { transform: 'translateY(0vh)' },
                { transform: 'translateY(110vh)' }
            ], {
                duration: Math.random() * 3000 + 3000,
                iterations: 1
            });

            anim.onfinish = () => heart.remove();
        }

        setInterval(createHeart, 300);
        
        // Mulai pertama kali
        window.onload = () => startTyping(0);
    </script>
</body>
</html>
